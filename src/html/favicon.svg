<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Background gradient circle -->
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </radialGradient>
  </defs>

  <!-- Main circle background -->
  <circle cx="50" cy="50" r="50" fill="url(#bgGrad)"/>

  <!-- Inner darker circle for depth -->
  <circle cx="50" cy="50" r="45" fill="#764ba2" opacity="0.6"/>

  <!-- Bold waveform bars (audio visualization) -->
  <rect x="20" y="32" width="4" height="24" rx="2" fill="#ffffff"/>
  <rect x="30" y="22" width="4" height="34" rx="2" fill="#ffffff"/>
  <rect x="40" y="35" width="4" height="20" rx="2" fill="#ffffff"/>
  <rect x="50" y="27" width="4" height="30" rx="2" fill="#ffffff"/>
  <rect x="60" y="38" width="4" height="16" rx="2" fill="#ffffff"/>

  <!-- "AI" text -->
  <text x="68" y="78" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="start">AI</text>

  <!-- Subtle shadow under text -->
  <text x="69" y="79" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#000000" opacity="0.2" text-anchor="start">AI</text>
</svg>
